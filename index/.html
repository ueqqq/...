<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pinar Press</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#f4ecd8;--ink:#1c1917;--red:#c8102e;--navy:#002a8f}
body{background:#09090b;color:#e4e4e7;font-family:Inter,system-ui,sans-serif}
.newspaper{background-color:var(--cream);color:var(--ink);font-family:'Libre Baskerville',Georgia,serif;box-shadow:0 25px 50px -12px rgb(0 0 0/.55);position:relative}
.newspaper.texture-low{background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E")}
.newspaper.texture-med{background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E")}
.newspaper.texture-high{background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E")}
.newspaper.tint-cream{--cream:#f4ecd8}.newspaper.tint-warm{--cream:#f0e4d0}.newspaper.tint-sun{--cream:#f5e8c7}.newspaper.tint-old{--cream:#ebe0c8}
.masthead{font-family:'Playfair Display',Georgia,serif;font-weight:900;letter-spacing:-.03em;line-height:.92}
.section-head{font-family:'Playfair Display',Georgia,serif;color:var(--red);font-weight:700;border-bottom:1.5px solid var(--red);padding-bottom:1px;margin-bottom:6px;display:inline-block;font-size:12.5px}
.col-text{font-size:10.5px;line-height:1.4;text-align:justify}
.col-text.tight{font-size:10px;line-height:1.32}
.thin-rule{border-color:#292524}
.cuban-stripe{height:3px;background:linear-gradient(to right,var(--red) 0 33%,#fff 33% 66%,var(--navy) 66% 100%)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#18181b}::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:3px}
input,textarea,select{background:#18181b;border:1px solid #27272a;color:#f4f4f5}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.btn{transition:all .12s}.btn:hover{filter:brightness(1.12)}
.btn-primary{background:var(--red);color:#fff}
.btn-secondary{background:#27272a;color:#e4e4e7;border:1px solid #3f3f46}
.btn-ghost{background:transparent;color:#a1a1aa;border:1px solid #27272a}
.preset-btn{font-size:11px;padding:6px 4px}
.preset-btn.active{background:var(--red);border-color:var(--red);color:#fff}
.panel-section{border-bottom:1px solid #27272a;padding-bottom:12px;margin-bottom:12px}
.label{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#71717a;margin-bottom:5px;display:block}
.img-frame{position:relative;overflow:hidden;background:#d6d3d1;border:1px solid #a8a29e}
.img-frame img{width:100%;height:100%;object-fit:cover;display:block}
.placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;background:linear-gradient(160deg,#c4b5a0,#a89070 40%,#8b7355 70%,#6b5344);color:#3d3229;font-size:12px}
.lang-btn.active{background:var(--red);color:#fff;border-color:var(--red)}
[contenteditable="true"]{outline:1px dashed transparent;border-radius:2px;cursor:text}
[contenteditable="true"]:hover{outline-color:#c8102e55}
[contenteditable="true"]:focus{outline:1px solid var(--red);background:rgba(200,16,46,.04)}
.layout-btn.active{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important}
</style>
</head>
<body class="min-h-screen flex flex-col">

<header class="border-b border-zinc-800 bg-zinc-950 px-4 py-2.5 flex items-center justify-between sticky top-0 z-50 gap-2 flex-wrap">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-red-700 to-red-950 flex items-center justify-center text-white font-bold text-xs border border-red-900/40">PR</div>
    <div>
      <h1 class="font-semibold text-white text-sm tracking-tight leading-none">Pinar Press</h1>
      <p class="text-[10px] text-zinc-500 mt-0.5">Diario de Cuba · Pinar del Río</p>
    </div>
  </div>
  <div class="flex items-center gap-2 flex-wrap justify-end">
    <div class="flex rounded overflow-hidden border border-zinc-700">
      <button id="langES" onclick="setLang('es')" class="lang-btn text-xs px-2.5 py-1 active">ES</button>
      <button id="langEN" onclick="setLang('en')" class="lang-btn text-xs px-2.5 py-1 bg-zinc-800">EN</button>
    </div>
    <button onclick="undo()" class="btn btn-ghost text-xs px-2 py-1.5 rounded">Undo</button>
    <button onclick="redo()" class="btn btn-ghost text-xs px-2 py-1.5 rounded">Redo</button>
    <button onclick="surpriseMe()" class="btn btn-ghost text-xs px-3 py-1.5 rounded">Surprise</button>
    <button onclick="randomMeta()" class="btn btn-ghost text-xs px-3 py-1.5 rounded">Random #</button>
    <button onclick="saveProject()" class="btn btn-ghost text-xs px-3 py-1.5 rounded">Save</button>
    <button onclick="document.getElementById('loadInput').click()" class="btn btn-ghost text-xs px-3 py-1.5 rounded">Load</button>
    <input type="file" id="loadInput" accept=".json" class="hidden" onchange="loadProject(event)"/>
    <button onclick="downloadPNG()" class="btn btn-primary text-xs px-4 py-1.5 rounded font-medium">Download PNG</button>
  </div>
</header>

<div class="flex flex-1 overflow-hidden">
<aside class="w-[360px] border-r border-zinc-800 bg-zinc-950 overflow-y-auto flex-shrink-0">
<div class="p-3.5 space-y-1">

  <div class="panel-section">
    <label class="label">Layout</label>
    <div class="grid grid-cols-3 gap-1.5 mb-2">
      <button onclick="setLayout('classic')" id="layClassic" class="btn btn-secondary text-[10px] py-1.5 rounded layout-btn active">Classic</button>
      <button onclick="setLayout('interview')" id="layInterview" class="btn btn-secondary text-[10px] py-1.5 rounded layout-btn">Interview</button>
      <button onclick="setLayout('split')" id="laySplit" class="btn btn-secondary text-[10px] py-1.5 rounded layout-btn">Split / Ads</button>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="text-[10px] text-zinc-500 mb-0.5 block">Columns</label>
        <select id="colCount" onchange="onField()" class="w-full rounded px-2 py-1 text-xs">
          <option value="4" selected>4</option>
          <option value="3">3</option>
        </select>
      </div>
      <div>
        <label class="text-[10px] text-zinc-500 mb-0.5 block">Text density</label>
        <select id="textTight" onchange="onField()" class="w-full rounded px-2 py-1 text-xs">
          <option value="normal" selected>Normal</option>
          <option value="tight">Tight</option>
        </select>
      </div>
    </div>
    <div class="mt-2">
      <label class="text-[10px] text-zinc-500 mb-0.5 block">Margins</label>
      <select id="paperPad" onchange="onField()" class="w-full rounded px-2 py-1 text-xs">
        <option value="p-6">Tight</option>
        <option value="p-8" selected>Normal</option>
        <option value="p-10">Wide</option>
      </select>
    </div>
  </div>

  <div class="panel-section">
    <label class="label">Presets</label>
    <div class="grid grid-cols-2 gap-1.5" id="presetGrid"></div>
  </div>

  <div class="panel-section">
    <label class="label">Cuban Identity</label>
    <div class="space-y-2">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[10px] text-zinc-500 mb-0.5 block">Paper tint</label>
          <select id="paperTint" onchange="onField()" class="w-full rounded px-2 py-1 text-xs">
            <option value="cream">Cream</option>
            <option value="warm" selected>Tobacco</option>
            <option value="sun">Caribbean sun</option>
            <option value="old">Aged</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] text-zinc-500 mb-0.5 block">Accent</label>
          <select id="accentRed" onchange="onField()" class="w-full rounded px-2 py-1 text-xs">
            <option value="#c8102e" selected>Flag red</option>
            <option value="#b91c1c">Standard</option>
            <option value="#9f1239">Deep rose</option>
            <option value="#7f1d1d">Dark tobacco</option>
          </select>
        </div>
      </div>
      <div>
        <label class="text-[10px] text-zinc-500 mb-0.5 block">Quick motto</label>
        <select id="mottoPick" onchange="applyMotto()" class="w-full rounded px-2 py-1 text-xs">
          <option value="">— choose —</option>
          <option value="Provincia • Consejo">Provincia • Consejo</option>
          <option value="Por la tierra y el pueblo">Por la tierra y el pueblo</option>
          <option value="De Viñales al Consejo">De Viñales al Consejo</option>
          <option value="Raíces firmes · Occidente vivo">Raíces firmes · Occidente vivo</option>
          <option value="Cuba en el Consejo">Cuba en el Consejo</option>
          <option value="Patria y provincia">Patria y provincia</option>
          <option value="Province • Council">Province • Council</option>
        </select>
      </div>
      <div class="flex gap-1.5">
        <button onclick="setCubanMood('oficial')" class="btn btn-ghost text-[10px] px-2 py-1 rounded flex-1">Oficial</button>
        <button onclick="setCubanMood('calido')" class="btn btn-ghost text-[10px] px-2 py-1 rounded flex-1">Cálido</button>
        <button onclick="setCubanMood('historico')" class="btn btn-ghost text-[10px] px-2 py-1 rounded flex-1">Histórico</button>
      </div>
    </div>
  </div>

  <div class="panel-section">
    <label class="label">Header</label>
    <div class="space-y-2">
      <div><label class="text-[10px] text-zinc-500 mb-0.5 block">Masthead</label>
        <input id="masthead" type="text" class="w-full rounded px-2.5 py-1.5 text-sm" oninput="onField()"/></div>
      <div><label class="text-[10px] text-zinc-500 mb-0.5 block">Byline</label>
        <input id="byline" type="text" placeholder="by YourName · DiplomaticaMC" class="w-full rounded px-2.5 py-1.5 text-sm" oninput="onField()"/></div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="text-[10px] text-zinc-500 mb-0.5 block">Motto</label>
          <input id="motto" type="text" class="w-full rounded px-2.5 py-1.5 text-sm" oninput="onField()"/></div>
        <div><label class="text-[10px] text-zinc-500 mb-0.5 block">Edition</label>
          <input id="edition" type="text" value="001" class="w-full rounded px-2.5 py-1.5 text-sm" oninput="onField()"/></div>
      </div>
      <div><label class="text-[10px] text-zinc-500 mb-0.5 block">Date</label>
        <input id="date" type="text" class="w-full rounded px-2.5 py-1.5 text-sm" oninput="onField()"/></div>
      <div class="flex flex-wrap gap-3 pt-0.5">
        <label class="flex items-center gap-1.5 text-xs cursor-pointer"><input type="checkbox" id="showStripe" checked onchange="onField()" class="rounded border-zinc-600"/> Stripe</label>
        <label class="flex items-center gap-1.5 text-xs cursor-pointer"><input type="checkbox" id="showEmblem" checked onchange="onField()" class="rounded border-zinc-600"/> Emblem</label>
        <label class="flex items-center gap-1.5 text-xs cursor-pointer"><input type="checkbox" id="showByline" checked onchange="onField()" class="rounded border-zinc-600"/> Byline</label>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[10px] text-zinc-500 mb-0.5 block">Emblem style</label>
          <select id="emblemStyle" onchange="onField()" class="w-full rounded px-2 py-1 text-xs">
            <option value="flag" selected>Cuban flag</option>
            <option value="monogram">P.R. monogram</option>
            <option value="both">Flag + monogram</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] text-zinc-500 mb-0.5 block">Emblem size</label>
          <select id="emblemSize" onchange="onField()" class="w-full rounded px-2 py-1 text-xs">
            <option value="sm">Small</option>
            <option value="md" selected>Medium</option>
            <option value="lg">Large</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="panel-section">
    <label class="label">Main Story</label>
    <div class="space-y-2">
      <div><label class="text-[10px] text-zinc-500 mb-0.5 block">Headline</label>
        <textarea id="headline" rows="2" class="w-full rounded px-2.5 py-1.5 text-sm resize-none" oninput="onField()"></textarea></div>
      <div><label class="text-[10px] text-zinc-500 mb-0.5 block">Subheadline</label>
        <textarea id="subhead" rows="2" class="w-full rounded px-2.5 py-1.5 text-sm resize-none" oninput="onField()"></textarea></div>
      <div><label class="text-[10px] text-zinc-500 mb-0.5 block">Caption</label>
        <input id="caption" type="text" class="w-full rounded px-2.5 py-1.5 text-sm" oninput="onField()"/></div>
    </div>
  </div>

  <div class="panel-section">
    <label class="label">1 · Hero Image</label>
    <input type="file" id="heroUpload" accept="image/*" class="w-full text-xs text-zinc-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-zinc-800 file:text-zinc-200 mb-2" onchange="handleImage(event,'hero')"/>
    <div class="grid grid-cols-2 gap-2">
      <div><label class="text-[10px] text-zinc-500 mb-0.5 block">Height</label>
        <select id="heroHeight" onchange="onField()" class="w-full rounded px-2 py-1 text-xs">
          <option value="160">S</option><option value="200">M</option><option value="260" selected>L</option><option value="320">XL</option>
        </select></div>
      <div><label class="text-[10px] text-zinc-500 mb-0.5 block">Focus</label>
        <select id="heroPos" onchange="onField()" class="w-full rounded px-2 py-1 text-xs">
          <option value="center">Center</option><option value="top">Top</option><option value="bottom">Bottom</option>
        </select></div>
    </div>
    <div class="flex items-center gap-3 mt-2">
      <button onclick="clearImage('hero')" class="btn btn-ghost text-[10px] px-2 py-1 rounded">Clear</button>
      <label class="flex items-center gap-1.5 text-xs cursor-pointer"><input type="checkbox" id="bwHero" checked onchange="onField()" class="rounded border-zinc-600"/> B&W</label>
    </div>
  </div>

  <div class="panel-section">
    <label class="label">2 · Secondary</label>
    <input type="file" id="secUpload" accept="image/*" class="w-full text-xs text-zinc-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-zinc-800 file:text-zinc-200 mb-2" onchange="handleImage(event,'sec')"/>
    <div class="grid grid-cols-2 gap-2">
      <div><label class="text-[10px] text-zinc-500 mb-0.5 block">Place</label>
        <select id="secPlace" onchange="onField()" class="w-full rounded px-2 py-1 text-xs">
          <option value="none">Hidden</option><option value="afterHero">After hero</option>
          <option value="col2">Col 2</option><option value="col3">Col 3</option><option value="col4">Col 4 / Ads</option>
        </select></div>
      <div><label class="text-[10px] text-zinc-500 mb-0.5 block">Size</label>
        <select id="secSize" onchange="onField()" class="w-full rounded px-2 py-1 text-xs">
          <option value="90">S</option><option value="130" selected>M</option><option value="170">L</option>
        </select></div>
    </div>
    <div class="flex items-center gap-3 mt-2">
      <button onclick="clearImage('sec')" class="btn btn-ghost text-[10px] px-2 py-1 rounded">Clear</button>
      <label class="flex items-center gap-1.5 text-xs cursor-pointer"><input type="checkbox" id="bwSec" checked onchange="onField()" class="rounded border-zinc-600"/> B&W</label>
    </div>
  </div>

  <div class="panel-section">
    <label class="label">3 · Tertiary</label>
    <input type="file" id="terUpload" accept="image/*" class="w-full text-xs text-zinc-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-zinc-800 file:text-zinc-200 mb-2" onchange="handleImage(event,'ter')"/>
    <div class="grid grid-cols-2 gap-2">
      <div><label class="text-[10px] text-zinc-500 mb-0.5 block">Place</label>
        <select id="terPlace" onchange="onField()" class="w-full rounded px-2 py-1 text-xs">
          <option value="none">Hidden</option><option value="afterHero">After hero</option>
          <option value="col2">Col 2</option><option value="col3">Col 3</option><option value="col4">Col 4 / Ads</option>
        </select></div>
      <div><label class="text-[10px] text-zinc-500 mb-0.5 block">Size</label>
        <select id="terSize" onchange="onField()" class="w-full rounded px-2 py-1 text-xs">
          <option value="90">S</option><option value="130" selected>M</option><option value="170">L</option>
        </select></div>
    </div>
    <div class="flex items-center gap-3 mt-2">
      <button onclick="clearImage('ter')" class="btn btn-ghost text-[10px] px-2 py-1 rounded">Clear</button>
      <label class="flex items-center gap-1.5 text-xs cursor-pointer"><input type="checkbox" id="bwTer" checked onchange="onField()" class="rounded border-zinc-600"/> B&W</label>
    </div>
  </div>

  <div class="panel-section">
    <label class="label">Compression</label>
    <div class="space-y-2">
      <div class="grid grid-cols-2 gap-2">
        <div><label class="text-[10px] text-zinc-500 mb-0.5 block">Max size</label>
          <select id="resizeMax" class="w-full rounded px-2 py-1 text-xs">
            <option value="1200">1200</option><option value="1600" selected>1600</option><option value="2000">2000</option><option value="0">Original</option>
          </select></div>
        <div><label class="text-[10px] text-zinc-500 mb-0.5 block">Format</label>
          <select id="resizeFormat" class="w-full rounded px-2 py-1 text-xs">
            <option value="image/jpeg" selected>JPEG</option><option value="image/webp">WebP</option>
          </select></div>
      </div>
      <div>
        <label class="text-[10px] text-zinc-500 mb-0.5 block flex justify-between"><span>Quality</span><span id="qualityLabel">85%</span></label>
        <input type="range" id="resizeQuality" min="50" max="98" value="85" class="w-full accent-red-700" oninput="$('qualityLabel').textContent=this.value+'%'"/>
      </div>
      <div class="flex gap-1.5">
        <button onclick="setCompressPreset('discord')" class="btn btn-ghost text-[10px] px-2 py-1 rounded flex-1">Discord</button>
        <button onclick="setCompressPreset('balanced')" class="btn btn-ghost text-[10px] px-2 py-1 rounded flex-1">Balanced</button>
      </div>
      <button onclick="reprocessImages()" class="btn btn-secondary text-xs w-full py-1.5 rounded">Re-process</button>
    </div>
  </div>

  <div class="panel-section">
    <label class="label">Paper & Export</label>
    <div class="space-y-2">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[10px] text-zinc-500 mb-0.5 block">Texture</label>
          <select id="paperTexture" onchange="onField()" class="w-full rounded px-2 py-1 text-xs">
            <option value="low">Low</option><option value="med" selected>Medium</option><option value="high">High</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] text-zinc-500 mb-0.5 block">Export</label>
          <select id="exportScale" class="w-full rounded px-2 py-1 text-xs">
            <option value="2">2×</option><option value="2.4" selected>2.4× Discord</option><option value="3">3×</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="panel-section">
    <label class="label">Columns / Ads text</label>
    <div class="space-y-2.5">
      <div><input id="col1Title" type="text" class="w-full rounded px-2 py-1 text-xs font-medium mb-1" oninput="onField()"/>
        <textarea id="col1Text" rows="3" class="w-full rounded px-2 py-1.5 text-xs resize-none" oninput="onField()"></textarea></div>
      <div><input id="col2Title" type="text" class="w-full rounded px-2 py-1 text-xs font-medium mb-1" oninput="onField()"/>
        <textarea id="col2Text" rows="3" class="w-full rounded px-2 py-1.5 text-xs resize-none" oninput="onField()"></textarea></div>
      <div><input id="col3Title" type="text" class="w-full rounded px-2 py-1 text-xs font-medium mb-1" oninput="onField()"/>
        <textarea id="col3Text" rows="3" class="w-full rounded px-2 py-1.5 text-xs resize-none" oninput="onField()"></textarea></div>
      <div><input id="col4Title" type="text" class="w-full rounded px-2 py-1 text-xs font-medium mb-1" oninput="onField()"/>
        <textarea id="col4Text" rows="3" class="w-full rounded px-2 py-1.5 text-xs resize-none" oninput="onField()"></textarea></div>
    </div>
  </div>

  <div class="pb-6 text-[10px] text-zinc-600">Pinar Press v3.0 · Cuba · Click text to edit · Ctrl+Z undo</div>
</div>
</aside>

<main class="flex-1 overflow-auto bg-zinc-900 p-5 flex justify-center items-start">
  <div id="newspaper" class="newspaper texture-med tint-warm w-[700px] p-8 select-none">
    <!-- top byline row -->
    <div id="bylineRow" class="flex justify-between items-center text-[9px] text-stone-600 mb-1 tracking-wide">
      <span id="preview-byline" contenteditable="true" data-bind="byline"></span>

  render();if(!skip)pushHistory()}
function setLayout(mode,skip){layout=mode;
  $('colsClassic').classList.toggle('hidden',mode!=='classic');
  $('colsInterview').classList.toggle('hidden',mode!=='interview');
  $('colsSplit').classList.toggle('hidden',mode!=='split');
  document.querySelectorAll('.layout-btn').forEach(b=>b.classList.remove('active'));
  if(mode==='classic')$('layClassic').classList.add('active');
  if(mode==='interview')$('layInterview').classList.add('active');
  if(mode==='split')$('laySplit').classList.add('active');
  render();if(!skip)pushHistory()}

function applyMotto(){const v=$('mottoPick').value;if(!v)return;$('motto').value=v;onField()}
function setCubanMood(m){
  if(m==='oficial'){$('paperTint').value='cream';$('accentRed').value='#c8102e';$('paperTexture').value='med';$('motto').value=lang==='es'?'Provincia • Consejo':'Province • Council'}
  else if(m==='calido'){$('paperTint').value='warm';$('accentRed').value='#9f1239';$('paperTexture').value='high';$('motto').value=lang==='es'?'Por la tierra y el pueblo':'From the land to the people'}
  else{$('paperTint').value='old';$('accentRed').value='#7f1d1d';$('paperTexture').value='high';$('motto').value=lang==='es'?'Raíces firmes · Occidente vivo':'Deep roots · Western Cuba'}
  onField()}

function getResizeSettings(){return{max:parseInt($('resizeMax').value,10)||1600,quality:(parseInt($('resizeQuality').value,10)||85)/100,format:$('resizeFormat').value||'image/jpeg'}}
function setCompressPreset(n){if(n==='discord'){$('resizeMax').value='1200';$('resizeFormat').value='image/webp';$('resizeQuality').value='78'}else{$('resizeMax').value='1600';$('resizeFormat').value='image/jpeg';$('resizeQuality').value='85'}$('qualityLabel').textContent=$('resizeQuality').value+'%'}
function resizeImage(dataUrl,maxSize=1600,quality=0.85,format='image/jpeg'){return new Promise(resolve=>{const img=new Image();img.onload=()=>{let{width,height}=img;if(maxSize>0&&(width>maxSize||height>maxSize)){const r=Math.min(maxSize/width,maxSize/height);width=Math.round(width*r);height=Math.round(height*r)}width-=width%2;height-=height%2;if(width<2)width=2;if(height<2)height=2;const c=document.createElement('canvas');c.width=width;c.height=height;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,width,height);let out;try{out=c.toDataURL(format,quality);if(format==='image/webp'&&out.startsWith('data:image/png'))out=c.toDataURL('image/jpeg',quality)}catch(e){out=c.toDataURL('image/jpeg',quality)}resolve(out)};img.onerror=()=>resolve(dataUrl);img.src=dataUrl})}
async function handleImage(e,slot){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=async ev=>{originalImages[slot]=ev.target.result;const{max,quality,format}=getResizeSettings();images[slot]=await resizeImage(ev.target.result,max,quality,format);render();pushHistory()};r.readAsDataURL(f)}
async function reprocessImages(){const{max,quality,format}=getResizeSettings();for(const s of['hero','sec','ter']){if(originalImages[s])images[s]=await resizeImage(originalImages[s],max,quality,format)}render();pushHistory()}
function clearImage(slot){images[slot]=null;originalImages[slot]=null;if(slot==='hero')$('heroUpload').value='';if(slot==='sec')$('secUpload').value='';if(slot==='ter')$('terUpload').value='';render();pushHistory()}

function shortDate(str){if(!str)return'20 NOV 2026';return str.replace(/DE /gi,'').replace('NOVIEMBRE','NOV').replace('NOVEMBER','NOV').replace('DICIEMBRE','DIC').replace('DECEMBER','DEC').replace('ENERO','ENE').replace('JANUARY','JAN').replace('FEBRERO','FEB').replace('FEBRUARY','FEB').replace('MARZO','MAR').replace('MARCH','MAR').replace('ABRIL','ABR').replace('APRIL','APR').replace('MAYO','MAY').replace('JUNIO','JUN').replace('JUNE','JUN').replace('JULIO','JUL').replace('JULY','JUL').replace('AGOSTO','AGO').replace('AUGUST','AUG').replace('SEPTIEMBRE','SEP').replace('SEPTEMBER','SEP').replace('OCTUBRE','OCT').replace('OCTOBER','OCT')}
function makeImgEl(src,h,bw){const w=document.createElement('div');w.className='img-frame';w.style.height=h+'px';const i=document.createElement('img');i.src=src;i.style.filter=bw?'grayscale(100%) contrast(1.05)':'none';w.appendChild(i);return w}

function render(){
  $('preview-masthead').textContent=$('masthead').value||'DIARIO DE PINAR DEL RÍO';
  $('preview-motto').textContent=$('motto').value||'';
  $('preview-edition').textContent=$('edition').value||'001';
  $('preview-date').textContent=$('date').value||'';
  $('preview-dateTop').textContent=$('date').value||'';
  $('preview-byline').textContent=$('byline').value||'';
  $('preview-headline').textContent=$('headline').value;
  $('preview-subhead').textContent=$('subhead').value;
  $('preview-caption').textContent=$('caption').value;
  $('bylineRow').style.display=$('showByline').checked?'flex':'none';

  // auto headline size
  const hl=$('headline').value||'';
  const hEl=$('preview-headline');
  if(hl.length>70)hEl.style.fontSize='20px';
  else if(hl.length>45)hEl.style.fontSize='22px';
  else hEl.style.fontSize='25px';

  ['col1Title','col2Title','col3Title','col4Title','col1Text','col2Text','col3Text','col4Text'].forEach(k=>{
    const v=$(k).value;
    document.querySelectorAll(`[data-bind="${k}"]`).forEach(n=>{if(!n.matches(':focus'))n.textContent=v});
  });

  $('p-foot-ed').textContent=$('edition').value||'001';
  $('p-foot-date').textContent=shortDate($('date').value);
  $('preview-stripe').style.display=$('showStripe').checked?'block':'none';

  // emblem
  const show=$('showEmblem').checked, style=$('emblemStyle').value, sz=$('emblemSize').value;
  const flag=$('flagEmblem'), mono=$('monogramWrap');
  const sizes={sm:{f:'w-9 h-6',m:'w-8 h-8 text-[12px]'},md:{f:'w-12 h-8',m:'w-10 h-10 text-[14px]'},lg:{f:'w-14 h-9',m:'w-12 h-12 text-[16px]'}};
  const S=sizes[sz]||sizes.md;
  flag.className='overflow-hidden border border-stone-600 shadow-sm '+S.f;
  mono.className='rounded-full border-[1.5px] border-stone-800 flex items-center justify-center '+S.m+(style==='monogram'||style==='both'?'':' hidden');
  if(!show){flag.style.display='none';mono.style.display='none'}
  else if(style==='flag'){flag.style.display='block';mono.style.display='none'}
  else if(style==='monogram'){flag.style.display='none';mono.style.display='flex'}
  else{flag.style.display='block';mono.style.display='flex'}

  // columns
  const cc=$('colCount').value;
  $('colsClassic').className='grid gap-3 mt-4 pt-3.5 border-t thin-rule '+(cc==='3'?'grid-cols-3':'grid-cols-4');
  if($('col4Wrap'))$('col4Wrap').style.display=cc==='3'?'none':'block';
  document.querySelectorAll('.col-text').forEach(el=>el.classList.toggle('tight',$('textTight').value==='tight'));

  // paper
  const paper=$('newspaper');
  paper.classList.remove('texture-low','texture-med','texture-high','tint-cream','tint-warm','tint-sun','tint-old','p-6','p-8','p-10');
  paper.classList.add('texture-'+$('paperTexture').value,'tint-'+$('paperTint').value,$('paperPad').value);
  const accent=$('accentRed').value;
  document.documentElement.style.setProperty('--red',accent);
  document.querySelectorAll('.section-head').forEach(el=>{el.style.color=accent;el.style.borderBottomColor=accent});

  // hero
  $('heroFrame').style.height=$('heroHeight').value+'px';
  const heroImg=$('heroImg'),heroPh=$('heroPh');
  if(images.hero){heroImg.src=images.hero;heroImg.classList.remove('hidden');heroPh.classList.add('hidden');heroImg.style.objectPosition=$('heroPos').value;heroImg.style.filter=$('bwHero').checked?'grayscale(100%) contrast(1.05)':'none'}
  else{heroImg.classList.add('hidden');heroPh.classList.remove('hidden')}

  const after=$('extraAfterHero');after.innerHTML='';after.classList.add('hidden');
  ['imgCol2','imgCol3','imgCol4','intImgArea','splImgAds'].forEach(id=>{const el=$(id);if(el)el.innerHTML=''});

  [['sec',$('secPlace').value,$('secSize').value,$('bwSec').checked],['ter',$('terPlace').value,$('terSize').value,$('bwTer').checked]].forEach(([key,place,size,bw])=>{
    if(!images[key]||place==='none')return;
    const el=makeImgEl(images[key],size,bw);
    if(place==='afterHero'){after.classList.remove('hidden');after.appendChild(el)}
    else if(place==='col2'){if(layout==='classic')$('imgCol2').appendChild(el);else if($('intImgArea'))$('intImgArea').appendChild(el.cloneNode(true))}
    else if(place==='col3'){if(layout==='classic')$('imgCol3').appendChild(el)}
    else if(place==='col4'){if(layout==='classic')$('imgCol4').appendChild(el);if(layout==='split'&&$('splImgAds'))$('splImgAds').appendChild(el.cloneNode(true))}
  });
}

document.addEventListener('focusout',e=>{
  const el=e.target;if(!el.isContentEditable||!el.dataset.bind)return;
  const key=el.dataset.bind,input=$(key);
  if(input&&input.value!==el.textContent){input.value=el.textContent;document.querySelectorAll(`[data-bind="${key}"]`).forEach(n=>{if(n!==el)n.textContent=el.textContent});pushHistory()}
});

function randomMeta(){$('edition').value=String(Math.floor(Math.random()*80)+1).padStart(3,'0');
  const months=lang==='es'?['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE']:['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  const d=Math.floor(Math.random()*28)+1,m=months[Math.floor(Math.random()*12)];
  $('date').value=lang==='es'?`${d} DE ${m} DE 2026`:`${d} ${m} 2026`;onField()}
function surpriseMe(){const keys=PRESET_KEYS.filter(k=>k!=='blank');loadPreset(keys[Math.floor(Math.random()*keys.length)]);randomMeta()}

async function downloadPNG(){const btn=event.currentTarget,o=btn.textContent;btn.textContent='…';btn.disabled=true;document.querySelectorAll('[contenteditable]').forEach(el=>el.blur());
  try{const scale=parseFloat($('exportScale').value)||2.4;const canvas=await html2canvas($('newspaper'),{scale,useCORS:true,backgroundColor:getComputedStyle($('newspaper')).backgroundColor||'#f4ecd8',logging:false});
    const a=document.createElement('a');a.download=`Diario_Pinar_${$('edition').value||'001'}.png`;a.href=canvas.toDataURL('image/png');a.click()}
  catch(err){console.error(err);alert('Export failed')}finally{btn.textContent=o;btn.disabled=false}}

function saveProject(){const data={version:7,lang,layout,...snapshot(),images,originalImages,resizeMax:$('resizeMax').value,resizeQuality:$('resizeQuality').value,resizeFormat:$('resizeFormat').value};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const a=document.createElement('a');a.download=`PinarPress_${data.edition||'001'}.json`;a.href=URL.createObjectURL(blob);a.click()}
function loadProject(e){const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(data.lang)setLang(data.lang);if(data.layout)setLayout(data.layout,true);applySnapshot(data);if(data.images)images=data.images;if(data.originalImages)Object.assign(originalImages,data.originalImages);render();pushHistory()}catch(err){alert('Invalid file')}};r.readAsText(file);e.target.value=''}

document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();e.shiftKey?redo():undo()}if((e.metaKey||e.ctrlKey)&&e.key==='y'){e.preventDefault();redo()}});

setLang('es');setCubanMood('calido');pushHistory();
</script>
